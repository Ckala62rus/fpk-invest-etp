services:
  backend-etp:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: backend-etp
    working_dir: /var/www
    volumes:
      - ./docker/php/config/php.ini:/usr/local/etc/php/conf.d/40-custom.ini
      - ./docker/php/config/xdebug.ini:/usr/local/etc/php/conf.d/99-xdebug.ini
      - ./src:/var/www
      - ./docker/php/logs:/var/log/php
    depends_on:
      postgres-etp:
        condition: service_healthy
      redis-etp:
        condition: service_started
      mailhog-etp:
        condition: service_started
    env_file:
      - .env
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-develop,debug}
      XDEBUG_CONFIG: ${XDEBUG_CONFIG:-client_host=host.docker.internal client_port=9003}
      PHP_IDE_CONFIG: ${PHP_IDE_CONFIG:-serverName=etp}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - etp

  nginx-etp:
    image: nginx:1.27-alpine
    container_name: nginx-etp
    ports:
      - "${NGINX_PORT:-8200}:80"
    volumes:
      - ./docker/nginx/config/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/config/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/certs:/etc/nginx/certs
      - ./docker/nginx/htpasswd:/etc/nginx/htpasswd
      - ./docker/nginx/templates:/etc/nginx/templates
      - ./docker/nginx/logs:/var/log/nginx
      - ./src:/var/www
    depends_on:
      - backend-etp
    environment:
      NGINX_UPSTREAM: backend-etp:9000
    restart: unless-stopped
    networks:
      - etp

  postgres-etp:
    image: postgres:16-alpine
    container_name: postgres-etp
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Точка монтирования — родительская папка; PGDATA — подкаталог (иначе .gitignore мешает initdb)
      - ./docker/postgres/data:/var/lib/postgresql
      - ./docker/postgres/logs:/var/log/postgresql
    environment:
      PGDATA: /var/lib/postgresql/pgdata
      POSTGRES_DB: ${POSTGRES_DB:-etp}
      POSTGRES_USER: ${POSTGRES_USER:-etp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etp}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etp} -d ${POSTGRES_DB:-etp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - etp

  redis-etp:
    image: redis:7-alpine
    container_name: redis-etp
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./docker/redis/data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    networks:
      - etp

  # Локальный SMTP + веб-UI для просмотра писем (верификация, сброс пароля)
  # UI: http://localhost:8025  |  SMTP для Laravel: mailhog-etp:1025
  mailhog-etp:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog-etp
    restart: unless-stopped
    ports:
      - "${MAILHOG_UI_PORT:-8025}:8025"
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
    networks:
      - etp

  # Планировщик Laravel: письма аукциона, опросы, автофиниш, очистка КП (фаза 12.3)
  # user www-data: как PHP-FPM, иначе файлы в storage (протоколы, отчёты) создаются от root
  # с правами 0700 и скачивание через API даёт 404.
  scheduler-etp:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: scheduler-etp
    working_dir: /var/www
    user: "www-data:www-data"
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./src:/var/www
    depends_on:
      postgres-etp:
        condition: service_healthy
      redis-etp:
        condition: service_started
    env_file:
      - .env
    environment:
      XDEBUG_MODE: "off"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - etp

  # Очередь Horizon (фаза 12.1). UI: http://localhost:8200/horizon
  # Тот же www-data, что и php-fpm: PDF/отчёты/документы читает API без chmod-костылей.
  horizon-etp:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: horizon-etp
    working_dir: /var/www
    user: "www-data:www-data"
    command: ["php", "artisan", "horizon"]
    volumes:
      - ./src:/var/www
    depends_on:
      postgres-etp:
        condition: service_healthy
      redis-etp:
        condition: service_started
    env_file:
      - .env
    environment:
      XDEBUG_MODE: "off"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - etp

  # WebSocket Laravel Reverb (фаза 12.2). Nginx API на 8200. SPA Echo: localhost:6001
  reverb-etp:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: reverb-etp
    working_dir: /var/www
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=6001"]
    ports:
      - "${REVERB_PORT:-6001}:6001"
    volumes:
      - ./src:/var/www
    depends_on:
      redis-etp:
        condition: service_started
      backend-etp:
        condition: service_started
    env_file:
      - .env
    environment:
      XDEBUG_MODE: "off"
      REVERB_SERVER_HOST: "0.0.0.0"
      REVERB_SERVER_PORT: "6001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - etp

  # Опционально: docker compose --profile tools up -d pgadmin-etp
  pgadmin-etp:
    image: dpage/pgadmin4:8
    container_name: pgadmin-etp
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-8081}:80"
    volumes:
      # Данные pgAdmin — подкаталог storage (в родительской папке может быть .gitignore)
      - ./docker/pgadmin/data/storage:/var/lib/pgadmin
      # Преднастроенное подключение к postgres-etp
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgpass:ro
    environment:
      # email-validator отклоняет спец-домены (.local); для Docker используем example.com
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    depends_on:
      postgres-etp:
        condition: service_healthy
    networks:
      - etp

networks:
  etp:
    driver: bridge
